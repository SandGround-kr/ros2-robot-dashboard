<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROS2 Robot Dashboard</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/robot-card.css">
</head>
<body>

  <header class="app-header">
    <div class="app-header__left">
      <div class="app-header__logo">
        <div class="app-header__logo-icon">🤖</div>
        <span class="app-header__title">ROS2 Dashboard</span>
        <span id="robot-name-header" style="margin-left:10px;color:#8b949e;font-size:13px;font-weight:400;"></span>
      </div>
    </div>
    <div class="app-header__right">
      <button id="update-btn" class="update-btn" style="display:none" title="업데이트 가능">
        <span class="update-btn__icon">↑</span>
        <span class="update-btn__label">업데이트</span>
        <span class="update-btn__badge js-update-badge"></span>
      </button>
      <button id="sim-connect-btn" class="sim-btn" title="시뮬레이션 뷰어 열기" disabled>
        <span class="sim-btn__dot"></span>
        <span>시뮬레이션</span>
      </button>
      <span id="connection-status" class="badge badge--unknown">
        <span class="status-dot status-dot--unknown"></span>연결 중...
      </span>
    </div>
  </header>

  <!-- 업데이트 모달 -->
  <div id="update-modal" class="update-modal" style="display:none">
    <div class="update-modal__box">
      <div class="update-modal__header">
        <span class="update-modal__title">업데이트 가능</span>
        <button class="update-modal__close js-update-modal-close">✕</button>
      </div>
      <div class="update-modal__versions">
        <span class="update-modal__ver update-modal__ver--current js-ver-current">—</span>
        <span class="update-modal__arrow">→</span>
        <span class="update-modal__ver update-modal__ver--latest js-ver-latest">—</span>
      </div>
      <div class="update-modal__commits-title">변경 사항</div>
      <ul class="update-modal__commits js-update-commits"></ul>
      <div class="update-modal__actions">
        <button class="btn btn--secondary js-update-modal-close">취소</button>
        <button class="btn btn--primary js-update-apply">업데이트 적용</button>
      </div>
    </div>
  </div>

  <!-- 업데이트 진행 오버레이 -->
  <div id="update-overlay" class="update-overlay" style="display:none">
    <div class="update-overlay__box">
      <div class="update-overlay__spinner"></div>
      <div class="update-overlay__title js-overlay-title">업데이트 적용 중...</div>
      <div class="update-overlay__sub js-overlay-sub">잠시만 기다려주세요</div>
    </div>
  </div>

  <main class="app-main">
    <div id="dashboard"></div>
  </main>

  <!-- roslibjs 호환 shim (CDN 불필요) -->
  <script src="/js/roslib-shim.js"></script>

  <!-- ROS 추상화 레이어 -->
  <script src="/js/ros/TopicHandler.js"></script>
  <script src="/js/ros/ServiceHandler.js"></script>
  <script src="/js/ros/ParamHandler.js"></script>
  <script src="/js/ros/TopicDiscovery.js"></script>

  <!-- 핵심 클라이언트 -->
  <script src="/js/RobotClient.js"></script>
  <script src="/js/RobotManager.js"></script>

  <!-- UI 컴포넌트 -->
  <script src="/js/ui/RobotCard.js"></script>
  <script src="/js/ui/Dashboard.js"></script>

  <!-- 앱 진입점 -->
  <script src="/js/app.js"></script>

</body>
</html>
